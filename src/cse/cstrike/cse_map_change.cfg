// ReGameDLL decides when the map ends. cse_mapcycle.dll replaces its sequential
// destination with a random map; /skip must use the same ChangeLevel path.
mp_timelimit 0
mp_maxrounds 0
mp_winlimit 6
mp_windifference 1
mp_chattime 10

// A short temporary time limit ends the map through the normal ChangeLevel path.
alias /skip "mp_timelimit 0.01; mp_chattime 1"
