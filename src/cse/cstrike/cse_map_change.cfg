// ReGameDLL reads the mapcycle when a map ends. Keep /skip on that same path
// instead of calling changelevel directly, so the randomized cycle stays in sync.
mp_timelimit 0
mp_maxrounds 0
mp_winlimit 6
mp_windifference 1
mp_chattime 10

// A short temporary time limit ends the map through the normal ChangeLevel path.
alias /skip "mp_timelimit 0.01; mp_chattime 1"
