// Counter-Strike Extended dedicated server configuration.

sv_aim 0
pausable 0
hostname "Counter-Strike 1.6 Server"
sv_maxspeed 320

// A map ends when one team wins six rounds.
mp_timelimit 0
mp_maxrounds 0
mp_winlimit 6
mp_windifference 1

// Reapply match rules on every map and register the /skip server alias.
mapchangecfgfile cse_map_change.cfg
exec cse_map_change.cfg

yb_difficulty 0
sv_cheats 0

exec listip.cfg
exec banned.cfg
